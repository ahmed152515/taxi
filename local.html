<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Taxi Services</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Header with Logo and Navigation -->
    <header class="header">
        <img src="img/logo.png" alt="Taxi Service Logo" class="logo">
        <nav class="main-nav">
            <a href="index.html" class="nav-btn">Home</a>
            <a href="local.html" class="nav-btn">Local</a>
            <a href="packages.html" class="nav-btn">Packages</a>
            <a href="services.html" class="nav-btn">Services</a>
            <a href="about.html" class="nav-btn">About</a>
        </nav>
    </header>

    <!-- Local Section -->
    <section class="local-section">
        <h2 class="section-title">Local Services</h2>
        <div class="search-form">
            <div class="form-group">
                <label>Pickup Location (Pune)</label>
                <div class="search-container">
                    <input type="text" class="search-input" id="puneSearch" placeholder="Search location in Pune...">
                    <div class="search-results" id="puneResults">
                        <!-- Pune location suggestions will appear here -->
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>Drop Location (Maharashtra)</label>
                <div class="search-container">
                    <input type="text" class="search-input" id="maharashtraSearch" placeholder="Search destination in Maharashtra...">
                    <div class="search-results" id="maharashtraResults">
                        <!-- Maharashtra location suggestions will appear here -->
                    </div>
                </div>
            </div>
            <form class="enquiry-form" id="localBookingForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" name="name" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number *</label>
                        <input type="tel" name="phone" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Journey Date *</label>
                        <input type="date" name="date" required>
                    </div>
                    <div class="form-group">
                        <label>Journey Time *</label>
                        <input type="time" name="time" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Additional Requirements</label>
                    <textarea name="requirements" placeholder="Any special requirements..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Book Now</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h3>Quick Links</h3>
                <ul class="footer-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="local.html">Local</a></li>
                    <li><a href="packages.html">Packages</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </div>
            
            <div class="footer-section">
                <h3>Contact Us</h3>
                <div class="contact-info">
                    <p><i class="fas fa-phone"></i> +91 9172766007</p>
                    <a href="https://maps.app.goo.gl/WGvZUz8xuo6DJW186?g_st=aw" class="review-link" target="_blank">
                        <i class="fas fa-star"></i> Leave a Review
                    </a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2024 Taxi Service. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        document.getElementById('localBookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = this.querySelector('[name="name"]').value;
            const phone = this.querySelector('[name="phone"]').value;
            const date = this.querySelector('[name="date"]').value;
            const time = this.querySelector('[name="time"]').value;
            const requirements = this.querySelector('[name="requirements"]').value;
            
            const whatsappMessage = `New Local Booking from Website:\n\nName: ${name}\nPhone: ${phone}\nDate: ${date}\nTime: ${time}\nAdditional Requirements: ${requirements}`;
            const encodedMessage = encodeURIComponent(whatsappMessage);
            const whatsappUrl = `https://wa.me/918329033541?text=${encodedMessage}`;
            
            window.open(whatsappUrl, '_blank');
        });
    </script>
</body>
</html>
